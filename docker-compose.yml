services:
  backend:
    build: ./backend
    container_name: python-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Mounts local backend code for hot reloading
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload # Added --reload flag

  frontend:
    build: ./frontend
    container_name: react-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app          # Mount local frontend directory into container
      - /app/node_modules        # Preserve container node_modules (anonymous volume)
    environment:
      - CHOKIDAR_USEPOLLING=true # Ensures live reload works across OS virtual filesystems